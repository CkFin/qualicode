# =====================================================================
#  Proxy inverso QualiCode (nginx sin privilegios, escucha en 8080)
#  - Unico punto de entrada publico (host:80 -> contenedor:8080)
#  - Sirve el frontend estatico y reenvia /api/ al contenedor "api"
#  - Cabeceras de seguridad y limite de peticiones al login
# =====================================================================

limit_req_zone $binary_remote_addr zone=login_zone:10m rate=20r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;                 # no revelar version de nginx
    client_max_body_size 3m;           # la API aplica el limite real (2 MiB)

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    # El navegador debe revalidar (ETag) antes de reutilizar su copia: tras un despliegue
    # nunca mezcla un index.html nuevo con un app.js viejo, y las respuestas de la API
    # con datos de usuario no se reutilizan sin preguntar al servidor.
    add_header Cache-Control "no-cache" always;

    # Fuerza bruta: maximo 20 intentos de login por minuto por IP
    location = /api/auth/login {
        limit_req zone=login_zone burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nunca servir archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
